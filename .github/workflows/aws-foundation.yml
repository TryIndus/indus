name: AWS platform verification

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - infra/**
      - scripts/deploy/**
      - docs/runbooks/aws-legacy-next.md
      - .github/workflows/aws-foundation.yml
      - .github/workflows/deploy-application.yml
      - .github/workflows/deploy-infrastructure.yml
  push:
    branches: [staging, main]
    paths:
      - Dockerfile
      - .dockerignore
      - next.config.ts
      - infra/**
      - scripts/deploy/**
      - docs/runbooks/aws-legacy-next.md
      - .github/workflows/aws-foundation.yml
      - .github/workflows/deploy-application.yml
      - .github/workflows/deploy-infrastructure.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Terraform, Helm, and legacy container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate GitHub Actions workflows
        run: |
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo \
            rhysd/actionlint@sha256:6f03470d0152251d7f07f7c4dc019dbe7024c72cd952f839544c7798843efa8f \
            -color

      - name: Check infrastructure lifecycle behavior
        run: |
          ruby scripts/deploy/test-infrastructure.rb
          ruby scripts/deploy/test-application.rb
          node --test scripts/deploy/test-staging-images.mjs

      - name: Validate Terraform formatting and environments
        shell: bash
        run: |
          set -euo pipefail
          image='hashicorp/terraform@sha256:6bbb82d575aa7bd4f0a2c6e3a0838ab9590426c08a71d7a2783643f01004d356'
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace "$image" fmt -check -recursive infra/terraform
          for directory in bootstrap/shared environments/staging environments/production; do
            docker run --rm --entrypoint /bin/sh --env TF_DATA_DIR=/tmp/terraform-data \
              --volume "$PWD:/workspace" --workdir "/workspace/infra/terraform/$directory" "$image" \
              -ec 'terraform init -backend=false -input=false && terraform validate'
          done

      - name: Render Helm workloads
        shell: bash
        run: |
          set -euo pipefail
          image='alpine/helm:3.19.0'
          for chart in infra/helm/indus-applications infra/helm/indus-platform infra/helm/indus-legacy-next; do
            docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace "$image" lint "$chart"
            docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace "$image" template indus "$chart" >/dev/null
          done

          for environment in staging production; do
            docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace "$image" \
              template indus infra/helm/indus-applications \
              -f "infra/helm/indus-applications/values-$environment.yaml" \
              | ruby scripts/deploy/test-gitops.rb "$environment"
            docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace "$image" \
              template indus infra/helm/indus-platform \
              -f "infra/gitops/environments/$environment/values.yaml" \
              | ruby scripts/deploy/test-platform-chart.rb
          done

      - name: Test private GitOps bootstrap rendering
        shell: bash
        run: |
          set -euo pipefail
          fixture='{"cluster":{"name":"cluster-test","vpc_id":"vpc-test"},"network":{"vpc_cidr":"10.0.0.0/16"},"workload_role_arns":{"aws-load-balancer-controller":"role-lb","legacy-next":"role-legacy","platform-api":"role-api","sidekiq":"role-sidekiq","platform-outbox":"role-outbox","reports-consumer":"role-reports","market-data":"role-market","research-worker":"role-worker","database-migrator":"role-migrator","web-publisher":"role-publisher"},"shared_ecr_repository_urls":{"legacy-next":"repository-test"},"secret_arns":{"legacy_next":"secret-legacy","platform_api":"secret-api","market_data":"secret-market","research_worker":"secret-worker","database_migration":"secret-migration"},"edge":{"legacy_next_target_group_arn":"target-legacy","platform_api_target_group_arn":"target-api","market_data_target_group_arn":"target-market","cloudfront_distribution_id":"distribution-test"},"identity":{"issuer":"issuer-test","client_id":"client-test","userinfo_url":"userinfo-test"},"data_platform":{"web_bucket":"web-test","rds_proxy_endpoint":"database-test","redis_endpoint":"redis-test","redis_port":6379,"redis_cache_name":"cache-test","redis_user":"user-test","msk_bootstrap_brokers":"kafka-test","artifacts_bucket":"artifacts-test","raw_events_bucket":"events-test"},"replacement_platform":{"enabled":true,"temporal_address":"temporal-test","temporal_namespace":"namespace-test"}}'
          for environment in staging production; do
            TERRAFORM_OUTPUT_JSON="$fixture" AWS_REGION=region-test \
              ./scripts/deploy/render-gitops-bootstrap.sh "$environment" \
              | jq -e '.kind == "Application" and .spec.source.helm.valuesObject.vpcId == "vpc-test" and .spec.source.helm.valuesObject.platform.enabled == true and .spec.source.helm.valuesObject.platform.values.config.redisEndpoint == "redis-test"' \
              >/dev/null
          done

      - name: Build the current application container
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-anon-key \
            --tag indus-legacy-next:ci \
            .

      - name: Scan the current application container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: indus-legacy-next:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
