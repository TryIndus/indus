name: Verification

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  ALPACA_API_KEY: test-alpaca-key
  ALPACA_SECRET_KEY: test-alpaca-secret
  ALPACA_IS_PAPER: "true"
  GEMINI_API_KEY: test-gemini-key

jobs:
  core:
    name: Core application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run unit coverage
        run: bun run test:unit:coverage

      - name: Build production application
        run: bun run build

      - name: Audit production dependencies
        run: bun audit --production

  required:
    name: Required verification
    if: always()
    needs: [core]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce required jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
        run: test "$CORE_RESULT" = "success"
