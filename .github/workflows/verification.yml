name: Verification

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
  ALPACA_API_KEY: test-alpaca-key
  ALPACA_SECRET_KEY: test-alpaca-secret
  ALPACA_IS_PAPER: "true"
  GEMINI_API_KEY: test-gemini-key

jobs:
  core:
    name: Core application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type-check
        run: bun run typecheck

      - name: Run unit coverage
        run: bun run test:unit:coverage

      - name: Test Docker cleanup boundaries
        run: bun run test:docker-cleanup

      - name: Build production application
        run: bun run build

      - name: Audit production dependencies
        run: bun audit --production

  database:
    name: Database boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run migration and security tests
        run: bun run test:database

  integration:
    name: HTTP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run HTTP integration tests
        run: bun run test:integration

  browser:
    name: Browser and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run public accessibility tests
        run: bun run test:accessibility

      - name: Build production application
        run: bun run build

      - name: Run cross-browser tests
        run: bun run test:browser:run

      - name: Run performance budgets
        run: bun run test:performance:run

  authenticated:
    name: Authenticated browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run authenticated product and accessibility tests
        run: bun run test:authenticated

      - name: Upload authenticated browser diagnostics
        if: ${{ failure() && hashFiles('playwright-report/**', 'test-results/**') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authenticated-browser-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  contracts:
    name: Application contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate contracts, compatibility, and generated clients
        env:
          CONTRACT_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          contracts/scripts/validate.sh
          contracts/scripts/check-breaking.sh "$CONTRACT_BASE_REVISION"
          contracts/scripts/verify-generated.sh

  platform-api:
    name: Rails platform API
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: indus_test
          POSTGRES_USER: indus
          POSTGRES_PASSWORD: indus-local-password
        options: >-
          --health-cmd "pg_isready -U indus -d indus_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
      redis:
        image: redis:8.2.5-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgres://indus:indus-local-password@127.0.0.1:5432/indus_test
      REDIS_URL: redis://127.0.0.1:6379/1
      RAILS_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Rails toolchain
        run: docker build --tag indus-rails-toolchain:8.1.3.1 tooling/rails

      - name: Verify Rails application
        working-directory: apps/platform-api
        run: |
          docker run --rm --network host --entrypoint sh \
            --volume "$PWD:/workspace" --workdir /workspace \
            --env DATABASE_URL --env REDIS_URL --env RAILS_ENV \
            indus-rails-toolchain:8.1.3.1 \
            -lc 'set -eu; bundle install; bin/rails db:prepare; COVERAGE=true bundle exec rspec; bin/rubocop; bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error; bin/bundler-audit check --update'

      - name: Build production image
        run: docker build apps/platform-api

  replacement-web:
    name: Replacement web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run static and unit verification
        run: |
          bun run lint
          bun run typecheck
          bun run test:coverage
          bun run build

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium firefox webkit

      - name: Run browser, accessibility, and performance verification
        run: bun run test:e2e

  market-data:
    name: Rust market data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: indus_market_test
          POSTGRES_USER: indus
          POSTGRES_PASSWORD: indus-local-password
        options: >-
          --health-cmd "pg_isready -U indus -d indus_market_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgres://indus:indus-local-password@127.0.0.1:5432/indus_market_test
      TEST_KAFKA_BROKERS: 127.0.0.1:19092
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes cmake libcurl4-openssl-dev libssl-dev pkg-config

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview

      - name: Install pinned Rust coverage tool
        uses: taiki-e/install-action@76c2e6406e52637deed7160d77bded76bd83e06e # v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Start disposable Kafka
        run: |
          docker run --detach --name indus-redpanda --publish 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v25.2.1 \
            redpanda start --overprovisioned --smp=1 --memory=512M --reserve-memory=0M \
            --node-id=0 --check=false \
            --kafka-addr=external://0.0.0.0:19092 \
            --advertise-kafka-addr=external://127.0.0.1:19092
          timeout 60 bash -c 'until docker exec indus-redpanda rpk cluster health --exit-when-healthy; do sleep 2; done'
          docker exec indus-redpanda rpk topic create market.bars.v1 market.quotes.v1

      - name: Verify market data service
        working-directory: services/market-data
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo llvm-cov --locked --lib --tests --all-features --fail-under-lines 70
          cargo build --locked --release

  composed-platform:
    name: Composed platform and production images
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exercise replacement services and dependency recovery
        run: scripts/test-replacement-platform.sh

      - name: Build static web publisher image
        run: docker build --file infra/images/web-publisher/Dockerfile --tag indus-web-publisher:ci .

      - name: Scan Rails API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: indus-platform-api:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan market data image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: indus-market-data:local
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan web publisher image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: indus-web-publisher:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  required:
    name: Required verification
    if: always()
    needs: [core, database, integration, browser, authenticated, contracts, platform-api, replacement-web, market-data, composed-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Enforce required jobs
        env:
          CORE_RESULT: ${{ needs.core.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          AUTHENTICATED_RESULT: ${{ needs.authenticated.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          PLATFORM_API_RESULT: ${{ needs.platform-api.result }}
          REPLACEMENT_WEB_RESULT: ${{ needs.replacement-web.result }}
          MARKET_DATA_RESULT: ${{ needs.market-data.result }}
          COMPOSED_PLATFORM_RESULT: ${{ needs.composed-platform.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$DATABASE_RESULT" = "success"
          test "$INTEGRATION_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
          test "$AUTHENTICATED_RESULT" = "success"
          test "$CONTRACTS_RESULT" = "success"
          test "$PLATFORM_API_RESULT" = "success"
          test "$REPLACEMENT_WEB_RESULT" = "success"
          test "$MARKET_DATA_RESULT" = "success"
          test "$COMPOSED_PLATFORM_RESULT" = "success"
