name: Retry capacity-limited infrastructure changes

on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

jobs:
  retry:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: optimized-rds-class
            environment: optimized-production
            lock_group: optimized-infrastructure
            root: infra/optimized/terraform/environment
            region_variable: OPTIMIZED_AWS_REGION
            role_variable: OPTIMIZED_TERRAFORM_ROLE_ARN
            backend_secret: OPTIMIZED_TF_BACKEND_CONFIG_B64
            tfvars_secret: OPTIMIZED_TF_VARS_B64
            backend_bucket_pattern: '^bucket[[:space:]]*=[[:space:]]*"indus-optimized-terraform-state-[0-9]{12}"[[:space:]]*$'
            backend_key_pattern: '^key[[:space:]]*=[[:space:]]*"optimized/production/terraform.tfstate"[[:space:]]*$'
            address: aws_db_instance.this
            type: aws_db_instance
            attribute: instance_class
            desired: db.t4g.micro
            side_effects: '{"apply_immediately":true}'
            preflight_kind: rds-no-pending-modifications
            preflight_id: indus-optimized
            retry_codes: '["InsufficientDBInstanceCapacity"]'
    environment: ${{ matrix.target.environment }}
    concurrency:
      group: ${{ matrix.target.lock_group }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with: { terraform_version: 1.14.2, terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ vars[matrix.target.region_variable] }}
          role-to-assume: ${{ vars[matrix.target.role_variable] }}
          role-session-name: indus-capacity-retry-${{ github.run_id }}
      - name: Restore isolated Terraform configuration
        env:
          BACKEND_CONFIG_B64: ${{ secrets[matrix.target.backend_secret] }}
          TFVARS_B64: ${{ secrets[matrix.target.tfvars_secret] }}
          ROOT: ${{ matrix.target.root }}
          BUCKET_PATTERN: ${{ matrix.target.backend_bucket_pattern }}
          KEY_PATTERN: ${{ matrix.target.backend_key_pattern }}
        run: |
          set -euo pipefail
          test -n "$BACKEND_CONFIG_B64"
          test -n "$TFVARS_B64"
          printf '%s' "$BACKEND_CONFIG_B64" | base64 --decode > "$ROOT/backend.hcl"
          printf '%s' "$TFVARS_B64" | base64 --decode > "$ROOT/terraform.tfvars"
          grep -Eq "$BUCKET_PATTERN" "$ROOT/backend.hcl"
          grep -Eq "$KEY_PATTERN" "$ROOT/backend.hcl"
      - name: Plan and apply only the approved size change
        id: retry
        env:
          ROOT: ${{ matrix.target.root }}
          TARGET: ${{ toJSON(matrix.target) }}
          ADDRESS: ${{ matrix.target.address }}
          PREFLIGHT_KIND: ${{ matrix.target.preflight_kind }}
          PREFLIGHT_ID: ${{ matrix.target.preflight_id }}
        run: |
          set -euo pipefail
          terraform -chdir="$ROOT" init -input=false -lockfile=readonly -backend-config=backend.hcl
          terraform -chdir="$ROOT" plan -input=false -target="$ADDRESS" -out=capacity.tfplan
          terraform -chdir="$ROOT" show -json capacity.tfplan > "$RUNNER_TEMP/capacity-plan.json"
          decision=$(node scripts/capacity/guard-plan.mjs plan "$RUNNER_TEMP/capacity-plan.json" "$TARGET")
          if [ "$decision" = no-op ]; then
            echo 'result=no-op' >> "$GITHUB_OUTPUT"
            echo 'Approved size is already present; no change was applied.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$PREFLIGHT_KIND" = rds-no-pending-modifications ]; then
            pending=$(aws rds describe-db-instances --db-instance-identifier "$PREFLIGHT_ID" --query 'DBInstances[0].PendingModifiedValues' --output json)
            if [ "$pending" != '{}' ]; then
              echo 'RDS has pending modifications; refusing to apply them immediately.' >&2
              exit 1
            fi
          elif [ -n "$PREFLIGHT_KIND" ]; then
            echo 'Unknown target preflight; refusing to apply.' >&2
            exit 1
          fi
          if terraform -chdir="$ROOT" apply -no-color -input=false capacity.tfplan > "$RUNNER_TEMP/capacity-apply.log" 2>&1; then
            echo 'result=applied' >> "$GITHUB_OUTPUT"
            echo 'Approved in-place size change applied successfully.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$(node scripts/capacity/guard-plan.mjs capacity-error "$RUNNER_TEMP/capacity-apply.log" "$TARGET")" = retry ]; then
            echo 'result=capacity-unavailable' >> "$GITHUB_OUTPUT"
            echo 'Capacity remains unavailable; the next scheduled run will retry.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Terraform apply failed for a reason other than the configured capacity error.' >&2
            exit 1
          fi
      - name: Ensure completion notification
        if: steps.retry.outputs.result == 'applied' || steps.retry.outputs.result == 'no-op'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ID: ${{ matrix.target.id }}
          TARGET_DESIRED: ${{ matrix.target.desired }}
          RESULT: ${{ steps.retry.outputs.result }}
          ASSIGNEE: ${{ vars.CAPACITY_RETRY_ASSIGNEE }}
        run: node scripts/capacity/notify-completion.mjs
