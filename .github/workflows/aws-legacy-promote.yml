name: Promote AWS legacy image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment that receives the existing immutable image
        required: true
        type: choice
        options: [production]
      digest:
        description: Existing signed ECR digest, including the sha256 prefix
        required: true
        type: string

concurrency:
  group: aws-legacy-promote-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_SHARED_REGION }}
  ECR_REPOSITORY: indus/legacy-next
  RELEASE_ENVIRONMENT: ${{ inputs.environment }}

jobs:
  promote:
    name: Open ${{ inputs.environment }} promotion
    if: vars.AWS_PROMOTION_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Validate promotion input
        env:
          DIGEST: ${{ inputs.digest }}
          PROMOTION_ROLE_ARN: ${{ vars.AWS_PROMOTION_ROLE_ARN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$PROMOTION_ROLE_ARN"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Configure short-lived verification credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PROMOTION_ROLE_ARN }}
          role-session-name: indus-promote-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify immutable signed image and SBOM attestation
        env:
          DIGEST: ${{ inputs.digest }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$ECR_REPOSITORY@$DIGEST"
          aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageId.imageDigest' \
            --output text | grep -Fx "$DIGEST"
          certificate_identity='https://github.com/TryIndus/indus/.github/workflows/aws-legacy-release.yml@refs/heads/main'
          cosign verify \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Update GitOps image digest
        shell: bash
        run: |
          set -euo pipefail
          values="infra/gitops/environments/$RELEASE_ENVIRONMENT/legacy-next.yaml"
          test "$(grep -c '^image: ' "$values")" -eq 1
          awk -v image="$IMAGE" '
            /^image: / { print "image: " image; updated += 1; next }
            { print }
            END { if (updated != 1) exit 1 }
          ' "$values" > "$values.next"
          mv "$values.next" "$values"

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: infra/gitops/environments/${{ env.RELEASE_ENVIRONMENT }}/legacy-next.yaml
          branch: deploy/legacy-next-${{ env.RELEASE_ENVIRONMENT }}-${{ github.run_id }}
          commit-message: Promote the legacy application to ${{ env.RELEASE_ENVIRONMENT }}
          title: Promote the legacy application to ${{ env.RELEASE_ENVIRONMENT }}
          body: |
            Promotes `${{ inputs.digest }}` through the reviewed GitOps path.

            After merge, Argo CD reconciles this exact digest in `${{ env.RELEASE_ENVIRONMENT }}`.
          delete-branch: true
