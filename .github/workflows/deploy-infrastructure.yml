name: Deploy infrastructure

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation
        required: true
        type: choice
        options: [plan, apply, plan-destroy-production, destroy-production]
      confirmation:
        description: Required for production destruction
        required: false
        type: string

concurrency:
  group: deploy-infrastructure-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  target:
    name: Validate branch and operation
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main) environment=production ;;
            *) echo "Infrastructure deployments must run from main." >&2; exit 1 ;;
          esac
          case "$OPERATION" in
            plan|apply|plan-destroy-production|destroy-production) ;;
            *) echo "Unsupported infrastructure operation." >&2; exit 1 ;;
          esac
          if [[ "$OPERATION" == plan-destroy-production || "$OPERATION" == destroy-production ]]; then
            [[ "$environment" == production ]] || { echo "Production destroy operations must run from main." >&2; exit 1; }
            [[ "$CONFIRMATION" == destroy-production ]] || { echo "Use confirmation destroy-production." >&2; exit 1; }
          fi
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  terraform:
    name: ${{ inputs.operation }} ${{ needs.target.outputs.environment }} infrastructure
    needs: target
    environment: ${{ needs.target.outputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.14.2

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ vars.AWS_TERRAFORM_REGION }}
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          role-session-name: indus-infrastructure-${{ github.run_id }}

      - name: Restore environment configuration
        env:
          BACKEND_CONFIG_B64: ${{ secrets.TF_BACKEND_CONFIG_B64 }}
          TFVARS_B64: ${{ secrets.TF_VARS_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_CONFIG_B64"
          test -n "$TFVARS_B64"
          environment="${{ needs.target.outputs.environment }}"
          printf '%s' "$BACKEND_CONFIG_B64" | base64 --decode > "infra/terraform/environments/$environment/backend.hcl"
          printf '%s' "$TFVARS_B64" | base64 --decode > "infra/terraform/environments/$environment/terraform.tfvars"

      - name: Plan
        env:
          OPERATION: ${{ inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          environment="${{ needs.target.outputs.environment }}"
          terraform -chdir="infra/terraform/environments/$environment" init -input=false -backend-config=backend.hcl
          if [[ "$OPERATION" == plan-destroy-production || "$OPERATION" == destroy-production ]]; then
            terraform -chdir="infra/terraform/environments/$environment" plan -destroy -input=false -out=approved.tfplan
          else
            terraform -chdir="infra/terraform/environments/$environment" plan -input=false -out=approved.tfplan
          fi

      - name: Apply saved plan
        if: inputs.operation == 'apply' || inputs.operation == 'destroy-production'
        shell: bash
        run: terraform -chdir=infra/terraform/environments/${{ needs.target.outputs.environment }} apply -input=false approved.tfplan
