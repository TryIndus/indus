name: Propose image promotion

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [development, staging, production]
        required: true
      platform_api_image:
        description: Signed platform-api reference including @sha256 digest
        type: string
        required: true
      market_data_image:
        description: Signed market-data reference including @sha256 digest
        type: string
        required: true
      web_image:
        description: Signed web reference including @sha256 digest
        type: string
        required: true
      release_id:
        description: Full lowercase Git commit SHA used to build all images
        type: string
        required: true

concurrency:
  group: promote-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  propose:
    name: Verify and propose ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { ref: main }

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          role-session-name: indus-promote-${{ github.run_id }}

      - name: Log in to shared ECR
        shell: bash
        run: aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0

      - name: Verify signatures and SBOM attestations
        shell: bash
        env:
          PLATFORM_API_IMAGE: ${{ inputs.platform_api_image }}
          MARKET_DATA_IMAGE: ${{ inputs.market_data_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
        run: |
          set -euo pipefail
          identity="https://github.com/TryIndus/indus/.github/workflows/release-images.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for image in "$PLATFORM_API_IMAGE" "$MARKET_DATA_IMAGE" "$WEB_IMAGE"; do
            case "$image" in *@sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
            cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image"
            cosign verify-attestation --type spdxjson --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$image"
          done

      - name: Update environment references
        shell: bash
        env:
          PLATFORM_API_IMAGE: ${{ inputs.platform_api_image }}
          MARKET_DATA_IMAGE: ${{ inputs.market_data_image }}
          WEB_IMAGE: ${{ inputs.web_image }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: ruby scripts/update-gitops-images.rb "${{ inputs.environment }}"

      - name: Open reviewed promotion pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          branch="promote/${TARGET_ENVIRONMENT}/${RELEASE_ID}"
          git config user.name "indus-release-bot"
          git config user.email "indus-release-bot@users.noreply.github.com"
          git checkout -b "$branch"
          git add "infra/gitops/environments/${TARGET_ENVIRONMENT}/values.yaml"
          git commit --no-gpg-sign -m "Promote ${RELEASE_ID} to ${TARGET_ENVIRONMENT}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Promote ${RELEASE_ID} to ${TARGET_ENVIRONMENT}" \
            --body "Promotes the same signed image digests to **${TARGET_ENVIRONMENT}**. Signature and SPDX attestations were verified before this PR was created. Merge remains subject to environment approval, required verification, and the cutover gates."
