name: AWS legacy release

on:
  push:
    branches: [main]
    paths:
      - app/**
      - components/**
      - hooks/**
      - lib/**
      - public/**
      - Dockerfile
      - bun.lock
      - bunfig.toml
      - next.config.ts
      - package.json
      - .github/workflows/aws-legacy-release.yml
  workflow_dispatch:

concurrency:
  group: aws-legacy-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_SHARED_REGION }}
  ECR_REPOSITORY: indus/legacy-next
  RELEASE_ENVIRONMENT: development

jobs:
  publish:
    name: Scan, sign, and publish immutable image
    if: vars.AWS_BUILD_ROLE_ARN != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release configuration
        env:
          BUILD_ROLE_ARN: ${{ vars.AWS_BUILD_ROLE_ARN }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AWS_REGION"
          test -n "$BUILD_ROLE_ARN"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          role-session-name: indus-legacy-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build release image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --build-arg "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL" \
            --build-arg "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --tag "$ECR_REGISTRY/$ECR_REPOSITORY:sha-$GITHUB_SHA" \
            .

      - name: Scan release image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generate release SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: legacy-next-${{ github.sha }}.spdx.json

      - name: Push immutable image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:sha-$GITHUB_SHA"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve, sign, and attest image digest
        id: release
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=sha-$GITHUB_SHA" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$ECR_REGISTRY/$ECR_REPOSITORY@$digest"
          cosign sign --yes "$image"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$image"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  promote:
    name: Open development promotion
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: development
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Configure short-lived verification credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_PROMOTION_ROLE_ARN }}
          role-session-name: indus-promote-${{ github.run_id }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify immutable signed image and SBOM attestation
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          IMAGE: ${{ needs.publish.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageDigest=$DIGEST" \
            --query 'images[0].imageId.imageDigest' \
            --output text | grep -Fx "$DIGEST"
          certificate_identity='https://github.com/TryIndus/indus/.github/workflows/aws-legacy-release.yml@refs/heads/main'
          cosign verify \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          cosign verify-attestation \
            --type spdxjson \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"

      - name: Update GitOps image digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          values="infra/gitops/environments/$RELEASE_ENVIRONMENT/legacy-next.yaml"
          test "$(grep -c '^image: ' "$values")" -eq 1
          awk -v image="$IMAGE" '
            /^image: / { print "image: " image; updated += 1; next }
            { print }
            END { if (updated != 1) exit 1 }
          ' "$values" > "$values.next"
          mv "$values.next" "$values"

      - name: Open promotion pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: infra/gitops/environments/${{ env.RELEASE_ENVIRONMENT }}/legacy-next.yaml
          branch: deploy/legacy-next-${{ env.RELEASE_ENVIRONMENT }}-${{ github.sha }}
          commit-message: Promote the legacy application to ${{ env.RELEASE_ENVIRONMENT }}
          title: Promote the legacy application to ${{ env.RELEASE_ENVIRONMENT }}
          body: |
            Promotes `${{ needs.publish.outputs.image }}` through the reviewed GitOps path.

            After merge, Argo CD reconciles this exact digest in `${{ env.RELEASE_ENVIRONMENT }}`.
          delete-branch: true
