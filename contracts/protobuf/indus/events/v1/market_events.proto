syntax = "proto3";

package indus.events.v1;

import "google/protobuf/timestamp.proto";
import "indus/events/v1/envelope.proto";

// MarketBarEvent is the normalized, provider-independent bar written to
// market.bars.v1. Decimal values are strings so prices do not lose precision.
message MarketBarEvent {
  EventEnvelope envelope = 1;
  string symbol = 2;
  AssetClass asset_class = 3;
  string interval = 4;
  google.protobuf.Timestamp window_start = 5;
  google.protobuf.Timestamp window_end = 6;
  string open = 7;
  string high = 8;
  string low = 9;
  string close = 10;
  string volume = 11;
  uint64 trade_count = 12;
  string volume_weighted_price = 13;
  uint64 provider_sequence = 14;
}

// MarketQuoteEvent is the normalized best bid and offer written to
// market.quotes.v1.
message MarketQuoteEvent {
  EventEnvelope envelope = 1;
  string symbol = 2;
  AssetClass asset_class = 3;
  google.protobuf.Timestamp observed_at = 4;
  string bid_price = 5;
  string ask_price = 6;
  string bid_size = 7;
  string ask_size = 8;
  repeated string conditions = 9;
  string tape = 10;
  uint64 provider_sequence = 11;
}

enum AssetClass {
  ASSET_CLASS_UNSPECIFIED = 0;
  ASSET_CLASS_EQUITY = 1;
  ASSET_CLASS_CRYPTO = 2;
}
