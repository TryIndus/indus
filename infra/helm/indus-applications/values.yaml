environment: replace-me
repository: https://github.com/TryIndus/indus.git
revision: main
clusterName: replace-me
vpcId: vpc-replace-me
awsRegion: replace-me
roles:
  loadBalancer: arn:aws:iam::000000000000:role/replace-load-balancer
legacyNext:
  enabled: true
  imageRepository: replace-with-ecr-repository
  serviceAccountRoleArn: arn:aws:iam::000000000000:role/replace-legacy-next
  runtimeSecretArn: arn:aws:secretsmanager:replace-me:000000000000:secret:replace-legacy-next
  targetGroupArn: arn:aws:elasticloadbalancing:replace-me:000000000000:targetgroup/replace/0000000000000000
platform:
  enabled: false
