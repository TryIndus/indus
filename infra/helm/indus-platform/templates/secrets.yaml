{{- $providers := dict
  "platform-api" (dict "arn" .Values.secrets.platformApi "keys" (list "DATABASE_URL" "REDIS_URL" "SECRET_KEY_BASE" "GEMINI_API_KEY"))
  "market-data" (dict "arn" .Values.secrets.marketData "keys" (list "DATABASE_URL" "ALPACA_API_KEY" "ALPACA_SECRET_KEY"))
  "research-worker" (dict "arn" .Values.secrets.researchWorker "keys" (list "DATABASE_URL" "REDIS_URL" "GEMINI_API_KEY" "TEMPORAL_API_KEY"))
-}}
{{- range $name, $provider := $providers }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "indus.labels" $ | nindent 4 }}
spec:
  provider: aws
  parameters:
    region: {{ $.Values.aws.region | quote }}
    objects: |
      - objectName: {{ $provider.arn | quote }}
        objectType: secretsmanager
        jmesPath:
        {{- range $provider.keys }}
          - path: {{ . | quote }}
            objectAlias: {{ . | quote }}
        {{- end }}
  secretObjects:
    - secretName: {{ $name }}-runtime
      type: Opaque
      data:
      {{- range $provider.keys }}
        - objectName: {{ . | quote }}
          key: {{ . | quote }}
      {{- end }}
{{- end }}
