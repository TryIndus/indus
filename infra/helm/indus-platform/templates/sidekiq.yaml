apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  labels:
    {{- include "indus.labels" . | nindent 4 }}
    app.kubernetes.io/name: sidekiq
spec:
  replicas: {{ .Values.sidekiq.replicas }}
  revisionHistoryLimit: 5
  strategy:
    rollingUpdate: { maxUnavailable: 1, maxSurge: 1 }
  selector:
    matchLabels:
      {{- include "indus.selectorLabels" (dict "root" . "name" "sidekiq") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "indus.selectorLabels" (dict "root" . "name" "sidekiq") | nindent 8 }}
        {{- include "indus.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson .Values.config | sha256sum }}
    spec:
      serviceAccountName: sidekiq
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        {{- include "indus.podSecurityContext" . | nindent 8 }}
      topologySpreadConstraints:
        {{- include "indus.spread" (dict "root" . "name" "sidekiq") | nindent 8 }}
      containers:
        - name: sidekiq
          image: {{ .Values.images.platformApi | quote }}
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "sidekiq"]
          envFrom:
            - secretRef: { name: platform-api-runtime }
          env:
            - { name: AUTH_PROVIDER, value: "cognito" }
            - { name: COGNITO_JWT_ISSUER, value: {{ .Values.identity.issuer | quote }} }
            - { name: COGNITO_CLIENT_ID, value: {{ .Values.identity.audience | quote }} }
            - { name: AWS_REGION, value: {{ .Values.aws.region | quote }} }
            - { name: REDIS_AUTH_MODE, value: "iam" }
            - { name: REDIS_ENDPOINT, value: {{ .Values.config.redisEndpoint | quote }} }
            - { name: REDIS_PORT, value: {{ .Values.config.redisPort | quote }} }
            - { name: REDIS_IAM_CACHE_NAME, value: {{ .Values.config.redisCacheName | quote }} }
            - { name: REDIS_IAM_USER, value: {{ .Values.config.redisUser | quote }} }
            - { name: KAFKA_BROKERS, value: {{ .Values.config.mskBootstrapBrokers | quote }} }
            - { name: KAFKA_AUTH_MODE, value: "msk_iam" }
            - { name: OTEL_SERVICE_NAME, value: "sidekiq" }
            - { name: OTEL_TRACES_EXPORTER, value: "otlp" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318" }
          resources:
            {{- toYaml .Values.sidekiq.resources | nindent 12 }}
          securityContext:
            {{- include "indus.containerSecurityContext" . | nindent 12 }}
          livenessProbe:
            exec: { command: ["/bin/sh", "-c", "kill -0 1"] }
            periodSeconds: 20
            timeoutSeconds: 3
          volumeMounts:
            - { name: runtime-secret, mountPath: /mnt/secrets-store, readOnly: true }
            - { name: tmp, mountPath: /rails/tmp }
            - { name: log, mountPath: /rails/log }
      volumes:
        - name: runtime-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: { secretProviderClass: platform-api }
        - name: tmp
          emptyDir: { sizeLimit: 1Gi }
        - name: log
          emptyDir: { sizeLimit: 1Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: sidekiq }
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "indus.selectorLabels" (dict "root" . "name" "sidekiq") | nindent 6 }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: sidekiq }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: sidekiq }
  minReplicas: {{ .Values.sidekiq.minReplicas }}
  maxReplicas: {{ .Values.sidekiq.maxReplicas }}
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
