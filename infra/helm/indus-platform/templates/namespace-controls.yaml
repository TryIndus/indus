apiVersion: v1
kind: ResourceQuota
metadata: { name: workload-budget }
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    pods: "100"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata: { name: container-defaults }
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }
      default: { cpu: 500m, memory: 512Mi }
      max: { cpu: "4", memory: 8Gi }
      min: { cpu: 10m, memory: 32Mi }
