{{- $accounts := dict
  "platform-api" .Values.roles.platformApi
  "sidekiq" .Values.roles.sidekiq
  "platform-outbox" .Values.roles.platformOutbox
  "reports-consumer" .Values.roles.reportsConsumer
  "market-data" .Values.roles.marketData
  "research-worker" .Values.roles.researchWorker
  "database-migrator" .Values.roles.databaseMigrator
  "web-publisher" .Values.roles.webPublisher
-}}
{{- range $name, $role := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "indus.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $role | quote }}
automountServiceAccountToken: true
{{- end }}
