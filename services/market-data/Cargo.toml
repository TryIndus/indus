[package]
name = "indus-market-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[dependencies]
async-trait = "0.1.89"
async-stream = "0.3.6"
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-msk-iam-sasl-signer = "1.0.1"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
futures = "0.3.31"
http = "1.4.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["rust_crypto"] }
prost = "0.14.3"
prost-types = "0.14.3"
prometheus = "0.14.0"
rand = "0.9.2"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "tracing"] }
reqwest = { version = "0.13.1", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["chrono", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.6.8", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.19.0", features = ["serde", "v5"] }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
